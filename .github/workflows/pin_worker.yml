name: Pinterest Pin Worker

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'  # 4 high-quality pins daily spaced every 6 hours (02:00, 08:00, 14:00, 20:00 UTC)
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pinterest Worker
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_RECIPES: ${{ secrets.PINTEREST_BOARD_RECIPES }}
          PINTEREST_BOARD_TRENDS: ${{ secrets.PINTEREST_BOARD_TRENDS }}
          PINTEREST_BOARD_SALADS: ${{ secrets.PINTEREST_BOARD_SALADS }}
          PINTEREST_BOARD_DINNER: ${{ secrets.PINTEREST_BOARD_DINNER }}
          PINTEREST_BOARD_DESSERTS: ${{ secrets.PINTEREST_BOARD_DESSERTS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python pinterest_engine/pin_generator.py --worker

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add topic_queue.json index.html bridge_page/ || true
          if [ -f pinterest_auth.json ]; then git add -f pinterest_auth.json; fi
          if [ -f pinterest_history.json ]; then git add -f pinterest_history.json; fi
          if [ -f pinterest_engine/pin_log.json ]; then git add -f pinterest_engine/pin_log.json; fi
          git commit -m "Automation: Update pin counts and bridge site [skip ci]" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main || (git rebase --abort && git pull --no-rebase -s ort -X ours origin main -m "Merge remote changes")
            git push origin main && echo "Successfully pushed changes!" && break || sleep 3
          done
